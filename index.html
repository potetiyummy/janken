<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>じゃんけん（オンライン）</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; background: #f3f4f6; margin: 0; padding: 16px; color: #111; }
  h1 { text-align: center; font-size: 1.6rem; margin: 8px 0 16px; }
  h2 { font-size: 1.2rem; margin: 0 0 12px; }
  .card { background: #fff; max-width: 560px; margin: 0 auto 16px; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  button { font-size: 1rem; padding: 10px 16px; border: none; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
  button:hover { opacity: .9; }
  button.secondary { background: #6b7280; }
  input[type=text], select { width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #d1d5db; border-radius: 8px; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row > input { flex: 1; }
  .list-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #eee; }
  .hands { display: flex; gap: 12px; justify-content: center; margin: 16px 0; }
  .hand-btn { font-size: 2.5rem; width: 90px; height: 90px; padding: 0; background: #fff; border: 2px solid #d1d5db; border-radius: 16px; }
  .hand-btn:hover { border-color: #2563eb; opacity: 1; }
  .players { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 12px 0; }
  .player { padding: 10px; border-radius: 8px; background: #f9fafb; text-align: center; border: 2px solid transparent; }
  .player.done { background: #ecfdf5; border-color: #10b981; }
  .player.win { background: #fef9c3; border-color: #eab308; }
  .player.lose { opacity: .5; }
  .big-hand { font-size: 2.2rem; }
  .result { font-size: 1.1rem; padding: 12px; border-radius: 8px; background: #fef9c3; text-align: center; margin: 12px 0; }
  .muted { color: #6b7280; font-size: .9rem; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .me { color: #2563eb; font-weight: bold; }
</style>
</head>
<body>
<h1>✊ じゃんけん ✌️ ✋</h1>
<div id="app"><p class="muted" style="text-align:center">読み込み中…</p></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, collection, setDoc, getDoc, updateDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ★ Firebaseコンソールで取得した自分のプロジェクトの設定に置き換えてください */
const firebaseConfig = {
  apiKey: "AIzaSyA-bO8TekgZJOvUC-RpqBnbMG_ntsTtIVs",
  authDomain: "janken-d3079.firebaseapp.com",
  projectId: "janken-d3079",
  storageBucket: "janken-d3079.firebasestorage.app",
  messagingSenderId: "446014488577",
  appId: "1:446014488577:web:5536f019b07309ddf30000"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const HANDS = { rock: '✊', scissors: '✌️', paper: '✋' };
const HAND_NAMES = { rock: 'グー', scissors: 'チョキ', paper: 'パー' };
const BEATS = { rock: 'scissors', scissors: 'paper', paper: 'rock' }; // キーが値に勝つ
const JOINED_KEY = 'janken-joined-groups';

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const groupId = new URLSearchParams(location.search).get('g');

/*
 Firestore構造
 groups/{gid}: { name, size, members: [{uid, name}], round, picked: {uid: round}, revealed }
 groups/{gid}/hands/{round}_{uid}: { uid, round, hand }  ← 全員そろうまで他人は読めない
*/
let user = null;
let group = null;        // 最新のグループデータ { id, ... }
let loaded = false;
let handsCache = null;   // { round, hands: { uid: hand } }
let loadingHandsRound = null;
let joinedNames = [];    // トップ画面用 [{id, name}]

/* ---------- 認証（Googleログイン） ---------- */
let started = false;
onAuthStateChanged(auth, u => {
  user = u;
  if (u) {
    if (!started) start();
    render();
  } else {
    loaded = true;
    render();
  }
});

function login() {
  signInWithPopup(auth, new GoogleAuthProvider()).catch(e => alert(`ログインに失敗しました：${e.message}`));
}

async function logout() {
  await signOut(auth);
  location.href = './';
}

function start() {
  started = true;
  if (groupId) {
    onSnapshot(doc(db, 'groups', groupId), snap => {
      loaded = true;
      group = snap.exists() ? { id: groupId, ...snap.data() } : null;
      if (group) rememberJoined(groupId);
      onGroupUpdate();
    }, err => showError(err));
  } else {
    loaded = true;
    loadJoinedNames().then(render);
    render();
  }
}

function showError(err) {
  console.error(err);
  app.innerHTML = `<div class="card"><p>エラー：${esc(err.message)}</p>
    <p class="muted">Firebaseの設定（firebaseConfig）と Firestore のセキュリティルールを確認してください。</p></div>`;
}

/* ---------- 参加中グループの記憶（トップ画面の一覧用） ---------- */
function getJoinedIds() { return JSON.parse(localStorage.getItem(JOINED_KEY) || '[]'); }
function rememberJoined(id) {
  const ids = getJoinedIds();
  if (!ids.includes(id)) { ids.push(id); localStorage.setItem(JOINED_KEY, JSON.stringify(ids)); }
}
async function loadJoinedNames() {
  const results = await Promise.all(getJoinedIds().map(async id => {
    const s = await getDoc(doc(db, 'groups', id));
    return s.exists() ? { id, name: s.data().name } : null;
  }));
  joinedNames = results.filter(Boolean);
}

/* ---------- グループ更新時の処理 ---------- */
function onGroupUpdate() {
  if (group) {
    const ref = doc(db, 'groups', groupId);
    // 全員の選択が揃ったら、誰か1人の端末が reveal を立てる（何度書いても同じ結果）
    if (isMember() && group.members.length === group.size && !group.revealed && allPicked()) {
      updateDoc(ref, { revealed: true }).catch(console.error);
    }
    if (group.revealed && handsCache?.round !== group.round && loadingHandsRound !== group.round) {
      loadHands();
    }
  }
  render();
}

const isMember = () => !!group && group.members.some(m => m.uid === user.uid);
const allPicked = () => group.members.every(m => group.picked?.[m.uid] === group.round);

async function loadHands() {
  const round = group.round;
  loadingHandsRound = round;
  const hands = {};
  await Promise.all(group.members.map(async m => {
    const s = await getDoc(doc(db, 'groups', groupId, 'hands', `${round}_${m.uid}`));
    hands[m.uid] = s.exists() ? s.data().hand : null;
  }));
  if (group.round === round) {
    handsCache = { round, hands };
    loadingHandsRound = null;
    render();
  }
}

/* ---------- アクション ---------- */
async function createGroup() {
  const name = document.getElementById('gname').value.trim();
  const size = Number(document.getElementById('gsize').value);
  if (!name) return alert('グループ名を入力してください');
  const ref = doc(collection(db, 'groups'));
  await setDoc(ref, { name, size, members: [], round: 1, picked: {}, revealed: false, createdAt: Date.now() });
  location.search = `?g=${ref.id}`;
}

async function joinGroup() {
  const name = document.getElementById('mname').value.trim();
  if (!name) return alert('名前を入力してください');
  const ref = doc(db, 'groups', groupId);
  try {
    await runTransaction(db, async tx => {
      const s = await tx.get(ref);
      const d = s.data();
      if (d.members.some(m => m.uid === user.uid)) return;
      if (d.members.length >= d.size) throw new Error('満員です');
      if (d.members.some(m => m.name === name)) throw new Error('同じ名前のメンバーがいます');
      tx.update(ref, { members: [...d.members, { uid: user.uid, name }] });
    });
  } catch (e) {
    alert(e.message);
  }
}

async function pick(hand) {
  const round = group.round;
  await setDoc(doc(db, 'groups', groupId, 'hands', `${round}_${user.uid}`), { uid: user.uid, round, hand });
  await updateDoc(doc(db, 'groups', groupId), { [`picked.${user.uid}`]: round });
}

function nextRound() {
  return updateDoc(doc(db, 'groups', groupId), { round: group.round + 1, picked: {}, revealed: false });
}

function copyInvite() {
  navigator.clipboard.writeText(location.href).then(() => alert('招待リンクをコピーしました'));
}

/* 勝敗判定：手が2種類なら勝ち／負け、1種類か3種類ならあいこ */
function judgeHands(hands) {
  const kinds = [...new Set(Object.values(hands))];
  if (kinds.length !== 2) return { draw: true };
  const [a, b] = kinds;
  const winHand = BEATS[a] === b ? a : b;
  return { draw: false, winHand };
}

/* ---------- 描画 ---------- */
function render() {
  if (!loaded) return;
  if (!user) {
    app.innerHTML = `<div class="card" style="text-align:center"><p>グループで遊ぶには Google アカウントでログインしてください。</p>
      <div class="actions" style="justify-content:center"><button data-action="login">Googleでログイン</button></div></div>`;
    return;
  }
  const bar = `<div class="card muted" style="display:flex;justify-content:space-between;align-items:center;padding:12px 20px">
      <span>${esc(user.displayName || user.email || 'ログイン中')}</span>
      <button class="secondary" data-action="logout">ログアウト</button></div>`;
  let content;
  if (!groupId) content = renderHome();
  else if (!group) content = `<div class="card"><p>グループが見つかりません。</p><div class="actions"><a href="./"><button class="secondary">トップへ</button></a></div></div>`;
  else content = renderGroup();
  app.innerHTML = bar + content;
}

function renderHome() {
  const joined = joinedNames.length
    ? joinedNames.map(g => `<div class="list-item"><strong>${esc(g.name)}</strong>
        <a href="?g=${g.id}"><button>開く</button></a></div>`).join('')
    : '<p class="muted">参加中のグループはありません。</p>';
  return `<div class="card"><h2>グループを作成</h2>
      <input type="text" id="gname" maxlength="20" placeholder="グループ名（例：飲み会組）">
      <label class="muted" style="display:block;margin-top:12px">人数</label>
      <select id="gsize">${[2, 3, 4, 5, 6, 7, 8].map(n => `<option value="${n}">${n}人</option>`).join('')}</select>
      <div class="actions"><button data-action="create">作成する</button></div>
    </div>
    <div class="card"><h2>参加中のグループ</h2>${joined}</div>`;
}

function renderGroup() {
  const { members, size, round, picked, revealed } = group;
  const me = isMember();
  const header = `<div class="card"><h2>${esc(group.name)}</h2>
      <p class="muted">メンバー ${members.length} / ${size}人　（ラウンド ${round}）</p>
      <div class="actions">
        <button class="secondary" data-action="copy">招待リンクをコピー</button>
        <a href="./"><button class="secondary">トップへ</button></a>
      </div></div>`;

  let body;
  if (!me) {
    body = members.length >= size
      ? `<p>満員です。</p>`
      : `<p>あなたの名前を入力して参加してください。</p>
         <div class="row"><input type="text" id="mname" maxlength="12" placeholder="名前" value="${esc(user.displayName || '')}">
         <button data-action="join">参加</button></div>`;
    return `<div class="card">${body}</div>` + header;
  }

  if (members.length < size) {
    return header + `<div class="card"><p>メンバーが揃うまでお待ちください（招待リンクを共有してください）。</p>
      ${renderPlayers()}</div>`;
  }

  if (revealed) {
    body = renderReveal();
  } else if (picked[user.uid] === round) {
    body = `<p>あなたは選択済みです。全員そろうまでお待ちください…</p>`;
  } else {
    body = `<p>あなたの手を選んでください。他の人には見えません。</p>
      <div class="hands">${['rock', 'scissors', 'paper'].map(h =>
        `<button class="hand-btn" data-action="pick" data-hand="${h}">${HANDS[h]}</button>`).join('')}</div>`;
  }

  return header + `<div class="card">${revealed ? '' : renderPlayers()}${body}</div>`;
}

function renderPlayers() {
  return `<div class="players">${group.members.map(m => {
    const done = group.picked?.[m.uid] === group.round;
    return `<div class="player ${done ? 'done' : ''}">
        ${esc(m.name)}${m.uid === user.uid ? '<div class="me">（あなた）</div>' : ''}
        <div class="muted">${done ? '選択済み' : '未選択'}</div></div>`;
  }).join('')}</div>`;
}

function renderReveal() {
  if (!handsCache || handsCache.round !== group.round) {
    return `<p class="muted">結果を読み込み中…</p>`;
  }
  const hands = handsCache.hands;
  const result = judgeHands(hands);

  let message;
  if (result.draw) {
    message = 'あいこです！';
  } else {
    const winners = group.members.filter(m => hands[m.uid] === result.winHand);
    const losers = group.members.filter(m => hands[m.uid] !== result.winHand);
    message = `勝ち：${winners.map(m => esc(m.name)).join('、')}（${HAND_NAMES[result.winHand]}）<br>` +
              `負け：${losers.map(m => esc(m.name)).join('、')}`;
  }

  const tiles = group.members.map(m => {
    const h = hands[m.uid];
    let cls = 'done';
    if (!result.draw) cls = h === result.winHand ? 'win' : 'lose';
    return `<div class="player ${cls}">
        <div class="big-hand">${h ? HANDS[h] : '？'}</div>
        ${esc(m.name)}${m.uid === user.uid ? '<span class="me">（あなた）</span>' : ''}
        <div class="muted">${h ? HAND_NAMES[h] : ''}</div>
      </div>`;
  }).join('');

  const btnLabel = result.draw ? 'もう一回' : '次のラウンド';
  return `<div class="players">${tiles}</div>
    <div class="result">${message}</div>
    <div class="actions"><button data-action="next">${btnLabel}</button></div>`;
}

/* ---------- クリック処理（イベント委譲） ---------- */
app.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  switch (el.dataset.action) {
    case 'create': return createGroup();
    case 'join':   return joinGroup();
    case 'pick':   return pick(el.dataset.hand);
    case 'next':   return nextRound();
    case 'copy':   return copyInvite();
    case 'login':  return login();
    case 'logout': return logout();
  }
});
</script>
</body>
</html>
